name: Update METAR

on:
  schedule:
    - cron: "5 */3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch METARs and update README
        run: |
          python3 - <<'EOF'
          import re, urllib.request

          STATIONS = ["SABE", "KABE"]

          def fetch(station):
              url = f"https://aviationweather.gov/api/data/metar?ids={station}&format=raw"
              req = urllib.request.Request(url, headers={"User-Agent": "Francocaccia-profile-readme"})
              try:
                  raw = urllib.request.urlopen(req, timeout=20).read().decode().strip().splitlines()
              except Exception as e:
                  print(station, "fetch failed:", e)
                  return None  # network error: keep the previous value
              if not raw or not raw[0].strip():
                  return "No recent METAR available for this station."
              return raw[0].strip()

          text = open("README.md", encoding="utf-8").read()

          for st in STATIONS:
              metar = fetch(st)
              if metar is None:
                  continue
              start, end = f"<!--METAR_{st}_START-->", f"<!--METAR_{st}_END-->"
              block = start + "\n```\n" + metar + "\n```\n" + end
              text = re.sub(re.escape(start) + r".*?" + re.escape(end), lambda m: block, text, flags=re.S)

          open("README.md", "w", encoding="utf-8").write(text)
          EOF

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore: update METAR" && git push)
